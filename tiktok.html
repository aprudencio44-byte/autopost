<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok conectado</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Autorização do TikTok recebida</h1>
<p id="msg">Pode voltar para o Finance Autopost. Esta página só serve de retorno da autorização.</p>
<script>
  if (new URLSearchParams(location.search).get("error")) {
    document.getElementById("msg").textContent = "O TikTok não autorizou o acesso. Tente de novo.";
  }
</script>
<footer><a href="index.html">Finance Autopost</a></footer>
</body>
</html>
